name: aircon

services:
  db:
    image: postgres:16
    container_name: aircon-db
    environment:
      POSTGRES_USER: aircon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: aircon
    volumes:
      - aircon-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aircon -d aircon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: aircon-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aircon:${POSTGRES_PASSWORD}@db:5432/aircon
      TEST_DATABASE_URL: postgresql+psycopg://aircon:${POSTGRES_PASSWORD}@db:5432/aircon_test
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  aircon-pgdata:
